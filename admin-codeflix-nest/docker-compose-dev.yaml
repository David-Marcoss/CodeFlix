version: "3"

services:
  app:
    build: .
    command: ./.docker/start.sh
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codeflix
    ports:
      - 3307:3306
    security_opt:
      - seccomp:unconfined
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
